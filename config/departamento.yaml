# Configuracion de ejemplo del generador de gestion del departamento.
# Profesores y asignaturas del semestre; la decision de quien imparte que se
# toma dentro del Excel generado (hoja Asignacion).

departamento:
  nombre: Matemática Aplicada
  semestre: "2026-2027 / 1"
  # Tope global de horas por profesor; un profesor puede declarar el suyo
  # propio con 'tope_horas' y ese manda. Sin tope no hay alerta de sobrecarga.
  tope_horas: 160
  # Filas reservadas por profesor en la hoja Profesores (10 si se omite).
  filas_por_profesor: 8

profesores:
  - {id: PIAD, nombre: "Pedro I. Alonso Diaz", grado: "Dr."}
  - {id: MARA, nombre: "Maria Ramirez",        grado: "MSc."}
  - {id: LGOM, nombre: "Luis Gomez",           grado: "Dr."}
  # Tope propio: media plaza.
  - {id: ANSU, nombre: "Ana Suarez",           grado: "MSc.", tope_horas: 80}
  - {id: RTOR, nombre: "Raul Torres",          grado: "Dr."}

asignaturas:
  # Los dos ejemplos de Fernando: la misma asignatura impartida a dos carreras
  # es dos entradas distintas. Las horas de CP son POR GRUPO.
  - id: EST-CC
    nombre: "Estadística (CC)"
    carrera: "Ciencia de la Computación"
    horas_conf: 32
    horas_cp: 32
    grupos_cp: 2
  - id: EST-MAT
    nombre: "Estadística (Mat)"
    carrera: "Matemática"
    horas_conf: 32
    horas_cp: 32
    grupos_cp: 1
  - id: AN-CD
    nombre: "Análisis Numérico (CD)"
    carrera: "Ciencia de Datos"
    horas_conf: 48
    horas_cp: 32
    grupos_cp: 3
  # Solo conferencias: sin grupos de CP.
  - id: SEM-MAT
    nombre: "Seminario de Matemática"
    carrera: "Matemática"
    horas_conf: 16
    horas_cp: 0
    grupos_cp: 0
