<script>
const D = {};
D["instalaciones"] = [
  {"nombre": "Pista 1", "capacidad": 40},
  {"nombre": "Pista 2", "capacidad": 30},
  {"nombre": "Gimnasio", "capacidad": 25},

];
D["anos"] = [

  {"id": "CC-2", "carrera": "Ciencia de la Computacion", "semana": "impar"},

  {"id": "FIS-1", "carrera": "Fisica", "semana": "par"},
  {"id": "FIS-2", "carrera": "Fisica", "semana": "par"}
];
D["disponibles"] = [
  {"ano": "CC-1", "horario": "10 a.m."},
  {"ano": "CC-1", "horario": "11 a.m."},
  {"ano": "CC-2", "horario": "11 a.m."},
  {"ano": "CC-2", "horario": "3 p.m."},

  {"ano": "MAT-2", "horario": "11 a.m."},
  {"ano": "MAT-2", "horario": "3 p.m."},
  {"ano": "FIS-1", "horario": "11 a.m."},
  {"ano": "FIS-1", "horario": "3 p.m."},
  {"ano": "FIS-2", "horario": "3 p.m."}
];
D["brigadas"] = [
  {"brigada": "C111", "ano": "CC-1", "personas": 28, "profesor": "Prof. Alvarez", "horario": "10 a.m.", "instalacion": "Pista 1"},
  {"brigada": "C112", "ano": "CC-1", "personas": 25, "profesor": "Prof. Alvarez", "horario": "11 a.m.", "instalacion": "Gimnasio"},
  {"brigada": "C211", "ano": "CC-2", "personas": 22, "profesor": "Prof. Benitez", "horario": "3 p.m.", "instalacion": "Piscina"},
  {"brigada": "C212", "ano": "CC-2", "personas": 20, "profesor": "Prof. Benitez", "horario": "11 a.m.", "instalacion": "Pista 2"},
  {"brigada": "M11", "ano": "MAT-1", "personas": 30, "profesor": "Prof. Castro", "horario": "10 a.m.", "instalacion": "Pista 2"},
  {"brigada": "M21", "ano": "MAT-2", "personas": 18, "profesor": "Prof. Castro", "horario": "11 a.m.", "instalacion": "Pista 2"},
  {"brigada": "F11", "ano": "FIS-1", "personas": 15, "profesor": "Prof. Alvarez", "horario": "10 a.m.", "instalacion": "Piscina"},
  {"brigada": "F21", "ano": "FIS-2", "personas": 12, "profesor": "Prof. Diaz", "horario": "", "instalacion": ""}
];
D["franja"] = [
  {"semana": "par", "horario": "10 a.m."},
  {"semana": "par", "horario": "11 a.m."},
  {"semana": "par", "horario": "3 p.m."},
  {"semana": "impar", "horario": "10 a.m."},
  {"semana": "impar", "horario": "11 a.m."},
  {"semana": "impar", "horario": "3 p.m."}
];
const CRECEN = [];

// --- Coercion, identica a la del evaluador de referencia del nucleo ---
function VACIO(x){ return x === null || x === undefined || x === ''; }
// Una fecha AAAA-MM-DD vale su dia juliano y una hora HH:MM sus minutos desde
// medianoche, exactamente como en nucleo/evaluador.lisp (FECHA-COMO-NUMERO y
// HORA-COMO-NUMERO). Antes se usaba parseFloat, y '2026-10-12' y '2026-10-10'
// valian los dos 2026: comparar dos fechas del mismo ano daba siempre falso.
function FECHANUM(s){
  const m = /^([0-9]{4})-([0-9]{2})-([0-9]{2})$/.exec(s);
  if (!m) return null;
  const anio = +m[1], mes = +m[2], dia = +m[3];
  if (mes < 1 || mes > 12 || dia < 1 || dia > 31) return null;
  const a = Math.floor((14 - mes) / 12), y = anio + 4800 - a, mm = mes + 12 * a - 3;
  return dia + Math.floor((153 * mm + 2) / 5) + 365 * y + Math.floor(y / 4)
         - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
}
function HORANUM(s){
  const m = /^([0-9]{2}):([0-9]{2})$/.exec(s);
  if (!m) return null;
  const h = +m[1], mi = +m[2];
  return (h <= 23 && mi <= 59) ? 60 * h + mi : null;
}
function ESFECHA(s){ return FECHANUM(s) !== null; }
function ESHORA(s){ return HORANUM(s) !== null; }
// Un texto vale su numero si lo es entero (Number, no parseFloat: '12abc' no
// es 12 para el evaluador), o su fecha o su hora; si no, 0.
function N(x){ if (typeof x === 'number') return x;
               if (VACIO(x) || x === false) return 0;
               if (x === true) return 0;
               const s = String(x);
               const f = FECHANUM(s); if (f !== null) return f;
               const h = HORANUM(s); if (h !== null) return h;
               const n = Number(s.trim()); return isNaN(n) ? 0 : n; }
// Un numero se ensena con hasta 10 cifras significativas, sin ceros a la
// derecha: la misma regla que nucleo/numeros.lisp (TEXTO-DE-NUMERO).
function NUMTXT(x){ if (Number.isInteger(x)) return String(x);
                    if (!isFinite(x)) return '';
                    return String(Number(x.toPrecision(10))); }
// Redondeo a N decimales con el empate alejandose de cero, sobre la
// escritura decimal del numero y no sobre el doble binario: 2.675 da 2.68,
// como NUCLEO:REDONDEAR-A-DECIMALES y como ROUND de la hoja de calculo
// (fase 2, hueco C6). Se lleva el numero a 15 cifras, se mueve la coma con
// la notacion exponencial (que JavaScript lee en decimal) y se redondea.
function REDONDEO(x, n){
  const s = Math.sign(x);
  const [m, e] = Math.abs(Number(x.toPrecision(15))).toExponential().split('e');
  const r = Math.floor(Number(m + 'e' + (Number(e) + n)) + 0.5);
  return s * Number(r + 'e' + (-n));
}
function REDONDEAR(x, n){
  if (VACIO(x)) return '';
  const r = REDONDEO(N(x), n);
  return r === 0 ? 0 : r;
}
// Un numero con exactamente N decimales; lo que no es numero, como siempre.
function NUMDEC(x, n){
  if (typeof x !== 'number' || !isFinite(x)) return T(x);
  const r = REDONDEO(x, n);
  return (r === 0 ? 0 : r).toFixed(n);
}
// Como se escribe un valor en la celda de su campo: con sus decimales.
function TC(x, campo){
  return (campo && campo.dec !== undefined) ? NUMDEC(x, campo.dec) : T(x);
}
function T(x){ if (x === null || x === undefined || x === false) return '';
               if (x === true) return 'si';
               if (typeof x === 'number') return NUMTXT(x);
               return String(x); }
// Un booleano del lenguaje es la cadena 'si' o 'no' (nucleo/booleanos.lisp).
// VERDAD dice si un valor cuenta como verdadero en una condicion; BOOL lo
// convierte en 'si' o 'no'.
function VERDAD(x){ return x === true || x === 'si' || (typeof x === 'number' && x !== 0); }
function BOOL(x){ return VERDAD(x) ? 'si' : 'no'; }
// Dividir por cero da vacio, como en el evaluador.
function DIV(a, b){ const d = N(b); return d === 0 ? '' : N(a) / d; }
function IG(a,b){ if (a === true) a = 'si'; if (b === true) b = 'si';
                  if (a === false) a = ''; if (b === false) b = '';
                  if (VACIO(a) && VACIO(b)) return true;
                  if (VACIO(a) || VACIO(b)) return false;
                  if (typeof a === 'number' || typeof b === 'number') return N(a) === N(b);
                  return String(a) === String(b); }
function V(x){ return x === undefined ? '' : x; }

// --- Busqueda por clave con su valor por defecto ---
// El valor por defecto es para cuando la fila no existe. Si existe y su campo
// esta vacio, el resultado es vacio: es lo que dice el evaluador de
// referencia, y lo que hace la hoja de calculo. Antes se devolvia el valor
// por defecto tambien en ese caso, y la pagina discrepaba de las otras dos.
function PROY(fila, campo, pordefecto){
  if (!fila) return pordefecto;
  return V(fila[campo]);
}

// --- Dos filas comparten algun valor en esos campos ---
function COMPARTEN(a, b, campos){
  const va = campos.map(c => a[c]).filter(x => !VACIO(x));
  const vb = campos.map(c => b[c]).filter(x => !VACIO(x));
  return va.some(x => vb.some(y => IG(x,y)));
}

// --- La fila contigua segun el orden declarado ---
// Con MISMOS (los campos de :MISMO), la contigua solo cuenta si tiene los
// mismos valores en ellos; si no, no hay fila (fase 2, hueco C3).
function VECINO(coleccion, fila, paso, mismos){
  const i = coleccion.indexOf(fila);
  const j = i + paso;
  if (j < 0 || j >= coleccion.length) return null;
  const contigua = coleccion[j];
  return (mismos || []).every(c => IG(contigua[c], fila[c])) ? contigua : null;
}

// --- Calcula los derivados de una fila y los deja puestos ---
function calcular(nombre, fila){
  const d = DERIV[nombre];
  if (!d) return fila;
  for (const campo in d) {
    try { fila[campo] = d[campo](fila); }
    catch (e) { fila[campo] = ''; }
  }
  return fila;
}

// Recalcula hasta punto fijo, no una sola pasada.
//
// POR QUE. Un campo derivado puede depender de OTRA fila de su misma
// coleccion -el ganador de un partido pasa al siguiente, el saldo de un
// renglon se arrastra del anterior-. Con una sola pasada en el orden del
// arreglo, cada render hace converger exactamente un nivel de esa cadena, y
// la pagina ensena valores incompletos sin avisar de nada.
//
// Lo encontro un experimento de alcance con un cuadro de eliminatorias, y es
// la clase de fallo que este trabajo le reprocha a la tesis de 2026: la
// arquitectura declaraba cumplir la derivacion viva y no la cumplia.
//
// El tope existe para que una dependencia circular no cuelgue el navegador.
// Si se alcanza, RECALCULO_INCOMPLETO queda en true y la pagina lo dice, que
// es lo unico honesto que se puede hacer: callar seria volver al verde falso.
const TOPE_DE_PASADAS = 32;
let RECALCULO_INCOMPLETO = false;

function huellaDe(){
  const partes = [];
  for (const nombre in D) for (const f of D[nombre]) partes.push(JSON.stringify(f));
  return partes.join('|');
}

// --- Marcas y estado de una fila ---
function marcasDe(nombreColeccion, fila){
  return MARCAS.filter(m => m.coleccion === nombreColeccion)
               .filter(m => { try { return VERDAD(m.cond(fila)); } catch(e){ return false; } });
}

function explicacionDe(m, fila){
  try { return m.explica ? T(m.explica(fila)) : m.leyenda; }
  catch(e){ return m.leyenda; }
}

// El estado de una fila en palabras: el mismo texto que escriben el texto
// plano y la hoja de calculo (NUCLEO:TEXTO-DE-ESTADO).
function estadoDe(nombreColeccion, fila){
  return marcasDe(nombreColeccion, fila).map(m => explicacionDe(m, fila)).join('; ');
}

function recalcularTodo(){
  let antes = huellaDe();
  for (let pasada = 0; pasada < TOPE_DE_PASADAS; pasada++) {
    for (const nombre in D) D[nombre].forEach(f => calcular(nombre, f));
    const despues = huellaDe();
    if (despues === antes) { RECALCULO_INCOMPLETO = false; return pasada + 1; }
    antes = despues;
  }
  RECALCULO_INCOMPLETO = true;
  return TOPE_DE_PASADAS;
}

const DERIV = {};
DERIV["instalaciones"] = {
  "brigadas": (f) => D["brigadas"].filter(c => IG(V(c["instalacion"]),V(f["nombre"]))).length,
  "menos-cargada": (f) => Math.min(...D["instalaciones"].filter(c => true).map(c => V(c["brigadas"])).map(N))
};
DERIV["brigadas"] = {
  "semana": (f) => PROY((D["anos"].find(c => IG(V(c["id"]),V(f["ano"]))) ?? null), "semana", ""),
  "capacidad": (f) => PROY((D["instalaciones"].find(c => IG(V(c["nombre"]),V(f["instalacion"]))) ?? null), "capacidad", 0),
  "disponible": (f) => (VACIO(V(f["horario"])) ? "" : (IG(PROY((D["disponibles"].find(c => (IG(V(c["ano"]),V(f["ano"])) && IG(V(c["horario"]),V(f["horario"])))) ?? null), "horario", ""),"") ? "no" : "si"))
};
DERIV["franja"] = {
  "brigadas": (f) => D["brigadas"].filter(c => (IG(V(c["semana"]),V(f["semana"])) && IG(V(c["horario"]),V(f["horario"])))).length,
  "menos-cargada": (f) => Math.min(...D["franja"].filter(c => true).map(c => V(c["brigadas"])).map(N))
};

const MARCAS = [
  {nombre: "sin-clase", leyenda: "sin clase", coleccion: "brigadas", clase: "problema", campos: ["horario", "instalacion"],
   cond: (f) => (VACIO(V(f["horario"])) || VACIO(V(f["instalacion"]))),
   explica: (f) => "Esta brigada todavia no tiene clase esta semana"},
  {nombre: "horario-no-disponible", leyenda: "horario no disponible", coleccion: "brigadas", clase: "problema", campos: ["horario"],
   cond: (f) => IG(V(f["disponible"]),"no"),
   explica: (f) => "Su ano no tiene este horario disponible"},
  {nombre: "instalacion-pequena", leyenda: "instalacion pequena", coleccion: "brigadas", clase: "problema", campos: ["instalacion", "personas", "capacidad"],
   cond: (f) => ((!VACIO(V(f["instalacion"]))) && (N(V(f["capacidad"])) < N(V(f["personas"])))),
   explica: (f) => ["La instalacion es para ", V(f["capacidad"]), " personas y la brigada tiene ", V(f["personas"])].map(T).join("")},
  {nombre: "instalacion-ocupada", leyenda: "instalacion ocupada", coleccion: "brigadas", clase: "problema", campos: ["instalacion"],
   cond: (f) => ((!VACIO(V(f["instalacion"]))) && (!VACIO(V(f["horario"]))) && D["brigadas"].some(o => o !== f && (IG(V(o["semana"]),V(f["semana"])) && IG(V(o["horario"]),V(f["horario"])) && IG(V(o["instalacion"]),V(f["instalacion"]))))),
   explica: (f) => "Otra brigada usa esta instalacion en ese horario y esa semana"},
  {nombre: "profesor-en-dos-brigadas", leyenda: "profesor en dos brigadas", coleccion: "brigadas", clase: "problema", campos: ["profesor", "horario"],
   cond: (f) => ((!VACIO(V(f["horario"]))) && D["brigadas"].some(o => o !== f && (IG(V(o["semana"]),V(f["semana"])) && IG(V(o["horario"]),V(f["horario"])) && IG(V(o["profesor"]),V(f["profesor"]))))),
   explica: (f) => "Este profesor tiene otra brigada en ese horario y esa semana"},
  {nombre: "instalacion-desequilibrada", leyenda: "instalacion desequilibrada", coleccion: "instalaciones", clase: "advertencia", campos: ["brigadas"],
   cond: (f) => (N(V(f["brigadas"])) > N((N(V(f["menos-cargada"])) + N(1)))),
   explica: (f) => ["Tiene ", V(f["brigadas"]), " brigadas y otra tiene ", V(f["menos-cargada"])].map(T).join("")},
  {nombre: "horario-desequilibrado", leyenda: "horario desequilibrado", coleccion: "franja", clase: "advertencia", campos: ["brigadas"],
   cond: (f) => (N(V(f["brigadas"])) > N((N(V(f["menos-cargada"])) + N(1)))),
   explica: (f) => ["Tiene ", V(f["brigadas"]), " brigadas y otro horario tiene ", V(f["menos-cargada"])].map(T).join("")}
];

const DOMINIOS = {};
DOMINIOS["brigadas.horario"] = {bloquea: false, valores: () => ["10 a.m.", "11 a.m.", "3 p.m."]};
DOMINIOS["brigadas.instalacion"] = {bloquea: false, valores: () => [...new Set(D["instalaciones"].filter(c => true).map(c => V(c["nombre"])).filter(x => !VACIO(x)))]};

const VISTAS = [
  {nombre: "reparto", titulo: "Reparto de brigadas", coleccion: "brigadas", entrada: true},
  {nombre: "ocupacion", titulo: "Ocupacion de instalaciones", coleccion: "brigadas", entrada: false},
  {nombre: "por-profesor", titulo: "Horario del profesor", coleccion: "brigadas", entrada: false},
  {nombre: "locales", titulo: "Instalaciones", coleccion: "instalaciones", entrada: false},
  {nombre: "casillas", titulo: "Brigadas por horario", coleccion: "franja", entrada: false},
  {nombre: "declaraciones", titulo: "Anos de carrera", coleccion: "anos", entrada: false}
];

const ORDENES = {};

const TABLAS = [
  {id: "t-reparto", vista: "reparto", titulo: "Reparto de brigadas", coleccion: "brigadas", crece: false, agrupa: null, columnaEstado: "Estado", campos: [{n: "brigada", e: "Brigada", rol: "fijo", tipo: "texto", clave: null}, {n: "ano", e: "Ano", rol: "fijo", tipo: "texto", clave: null}, {n: "personas", e: "Personas", rol: "fijo", tipo: "entero", clave: null}, {n: "profesor", e: "Profesor", rol: "fijo", tipo: "texto", clave: null}, {n: "horario", e: "Horario", rol: "entrada", tipo: "texto", clave: null}, {n: "instalacion", e: "Instalacion", rol: "entrada", tipo: "texto", clave: null}, {n: "semana", e: "Semana", rol: "derivado", tipo: "texto", clave: null}, {n: "capacidad", e: "Capacidad", rol: "derivado", tipo: "entero", clave: null}, {n: "disponible", e: "Horario disponible", rol: "derivado", tipo: "texto", clave: null}]},
  {id: "t-locales", vista: "locales", titulo: "Instalaciones", coleccion: "instalaciones", crece: false, agrupa: null, columnaEstado: "Estado", campos: [{n: "nombre", e: "Instalacion", rol: "fijo", tipo: "texto", clave: null}, {n: "capacidad", e: "Capacidad", rol: "fijo", tipo: "entero", clave: null}, {n: "brigadas", e: "Brigadas", rol: "derivado", tipo: "entero", clave: null}, {n: "menos-cargada", e: "La que menos tiene", rol: "derivado", tipo: "entero", clave: null}]},
  {id: "t-casillas", vista: "casillas", titulo: "Brigadas por horario", coleccion: "franja", crece: false, agrupa: null, columnaEstado: "Estado", campos: [{n: "semana", e: "Semana", rol: "fijo", tipo: "texto", clave: null}, {n: "horario", e: "Horario", rol: "fijo", tipo: "texto", clave: null}, {n: "brigadas", e: "Brigadas", rol: "derivado", tipo: "entero", clave: null}, {n: "menos-cargada", e: "La que menos tiene", rol: "derivado", tipo: "entero", clave: null}]},
  {id: "t-declaraciones", vista: "declaraciones", titulo: "Anos de carrera", coleccion: "anos", crece: false, agrupa: null, columnaEstado: "Estado", campos: [{n: "id", e: "Ano", rol: "fijo", tipo: "texto", clave: null}, {n: "carrera", e: "Carrera", rol: "fijo", tipo: "texto", clave: null}, {n: "semana", e: "Semana", rol: "fijo", tipo: "texto", clave: null}]},

];

const CRUCES = [
  {id: "c-ocupacion", titulo: "Ocupacion de instalaciones", coleccion: "brigadas", ejeFilas: "instalacion", etiquetaFilas: "Instalacion", ejeColumnas: "horario", etiquetaColumnas: "Horario", celda: "brigada", campoCelda: {n: "brigada", e: "Brigada", rol: "fijo", tipo: "texto", clave: null}, entrada: false, orden: null, secciones: "semana", etiquetaSecciones: "Semana", filtro: null, dominioFilas: () => [...new Set(D["instalaciones"].filter(c => true).map(c => V(c["nombre"])).filter(x => !VACIO(x)))], dominioColumnas: () => ["10 a.m.", "11 a.m.", "3 p.m."], dominioSecciones: () => ["par", "impar"]},

];

const ORDEN = [
  {tipo: 'tabla', indice: 0},
  {tipo: 'cruce', indice: 0},
  {tipo: 'cruce', indice: 1},
  {tipo: 'tabla', indice: 1},
  {tipo: 'tabla', indice: 2},
  {tipo: 'tabla', indice: 3},

];

// === Dibujo de la pagina ===
// (materializador/verificar-web.js corta el programa aqui: lo de arriba es el
// calculo, que se compara con el evaluador; lo de abajo toca el DOM.)

// Las celdas que dependen de los datos, cada una con su funcion de puesta al
// dia. Se rellena en construir() y se recorre en actualizar().
let ACTUALIZADORES = [];
let FIRMA = null;

function registrar(f){ ACTUALIZADORES.push(f); f(); }

// Los valores distintos de un campo, en orden de primera aparicion.
function distintosDe(filas, campo){
  const vistos = [];
  for (const f of filas) {
    const v = f[campo];
    if (!VACIO(v) && !vistos.some(x => IG(x, v))) vistos.push(v);
  }
  return vistos;
}

// --- Controles de entrada ---
//
// Un control se crea una vez y escribe en la fila que le toca. Si el mismo
// dato se ve en otro sitio (una rejilla y su tabla), el otro control se pone
// al dia en actualizar(), salvo el que tiene el foco: a ese no se le toca.
let SECUENCIA = 0;
function controlDe(nombreColeccion, campo, fila, ref){
  const td = document.createElement('td');
  td.className = 'entrada';
  const clave = nombreColeccion + '.' + campo.n;
  const dominio = DOMINIOS[clave];
  let control;
  if (dominio && dominio.bloquea) {
    control = document.createElement('select');
    const vacia = document.createElement('option');
    vacia.value = ''; vacia.textContent = '';
    control.appendChild(vacia);
    for (const v of dominio.valores()) {
      const o = document.createElement('option');
      o.value = T(v); o.textContent = T(v);
      control.appendChild(o);
    }
  } else {
    control = document.createElement('input');
    if (campo.tipo === 'entero' || campo.tipo === 'numero') control.type = 'number';
    // Plan aprobado de tipos, seccion 4.1: un selector de verdad.
    if (campo.tipo === 'fecha') control.type = 'date';
    if (campo.tipo === 'hora') control.type = 'time';
    if (dominio) {
      const lista = document.createElement('datalist');
      lista.id = 'lista_' + (++SECUENCIA);
      for (const v of dominio.valores()) {
        const o = document.createElement('option');
        o.value = T(v);
        lista.appendChild(o);
      }
      control.setAttribute('list', lista.id);
      td.appendChild(lista);
    }
  }
  control.dataset.ref = ref;
  control.setAttribute('aria-label', campo.e);
  control.addEventListener('input', e => {
    const v = e.target.value;
    fila[campo.n] = (campo.tipo === 'entero' || campo.tipo === 'numero')
                    ? (v === '' ? '' : Number(v)) : v;
    actualizar();
  });
  // Un campo del orden se reordena al confirmarlo ('change': al salir del
  // control o pulsar Intro), no a cada tecla: reordenar vuelve a construir
  // la pagina, y hacerlo mientras se escribe se llevaria el foco.
  if ((ORDENES[nombreColeccion] || []).includes(campo.n)) {
    control.addEventListener('change', () => {
      if (reordenar(nombreColeccion)) actualizar();
    });
  }
  td.appendChild(control);
  const aviso = document.createElement('div');
  aviso.className = 'aviso';
  td.appendChild(aviso);
  registrar(() => {
    const actual = T(fila[campo.n]);
    const fuera = dominio && !VACIO(fila[campo.n]) &&
                  !dominio.valores().some(v => IG(v, fila[campo.n]));
    // Un desplegable que bloquea no puede ensenar un valor que no esta entre
    // sus opciones: el que ya venia en los datos se veria vacio. Se le anade
    // como opcion, para que se vea y se pueda corregir.
    if (control.tagName === 'SELECT' && fuera &&
        !Array.from(control.options).some(o => o.value === actual)) {
      const o = document.createElement('option');
      o.value = actual; o.textContent = actual;
      control.appendChild(o);
    }
    if (document.activeElement !== control) control.value = actual;
    aviso.textContent = fuera ? 'no está en la lista' : '';
  });
  return td;
}

// --- Tabla cruzada ---
//
// Los dos ejes y las secciones salen de los DATOS: si aparece un valor
// nuevo, cambia la forma y construir() lo dibuja. Todas las secciones de una
// vista comparten los mismos ejes, para que se lean igual.
//
// Si la vista declara el dominio de un eje (fase 2, hueco C1), sus valores
// son los del dominio, en su orden, haya datos o no; los de los datos que no
// esten en el van al final y se avisa debajo de la vista. Es la regla de
// NUCLEO/EJES.LISP, con el mismo texto de aviso.
function filasDelCruce(cruce){
  const todas = D[cruce.coleccion] || [];
  // El filtro esconde filas de la PRESENTACION y no toca D: los agregados y
  // las marcas siguen viendo la coleccion entera.
  return cruce.filtro ? todas.filter(f => VERDAD(cruce.filtro(f))) : todas;
}

function seccionesDe(cruce, filas){
  if (!cruce.secciones) return [null];
  return conDominio(seccionesSegunLosDatos(cruce, filas), cruce.dominioSecciones);
}

function seccionesSegunLosDatos(cruce, filas){
  return distintosDe(filas, cruce.secciones).sort(compararSecciones);
}

// Los valores de un dominio declarado, sin repetir y en su orden.
function valoresDelDominio(dominio){
  const unicos = [];
  for (const v of dominio()) {
    if (!VACIO(v) && !unicos.some(u => IG(u, v))) unicos.push(v);
  }
  return unicos;
}

// Los de VALORES que no estan en DECLARADOS, en su orden.
function ajenosAlDominio(valores, declarados){
  return valores.filter(v => !declarados.some(d => IG(d, v)));
}

// Sin dominio, los valores de los datos; con el, los del dominio y despues
// los de los datos que no esten en el.
function conDominio(valores, dominio){
  if (!dominio) return valores;
  const declarados = valoresDelDominio(dominio);
  return declarados.concat(ajenosAlDominio(valores, declarados));
}

// El aviso de los valores fuera del dominio, o '' si no hay ninguno. El
// mismo texto que NUCLEO:AVISO-FUERA-DE-DOMINIO.
function avisoFueraDeDominio(cruce, filas){
  const partes = [];
  const eje = (dominio, etiqueta, valores) => {
    if (!dominio) return;
    const fuera = ajenosAlDominio(valores, valoresDelDominio(dominio));
    if (fuera.length) partes.push(etiqueta + ': ' + fuera.map(T).join(', '));
  };
  eje(cruce.dominioFilas, cruce.etiquetaFilas, ejeSegunLosDatos(filas, cruce.ejeFilas, cruce));
  eje(cruce.dominioColumnas, cruce.etiquetaColumnas,
      ejeSegunLosDatos(filas, cruce.ejeColumnas, cruce));
  if (cruce.secciones)
    eje(cruce.dominioSecciones, cruce.etiquetaSecciones, seccionesSegunLosDatos(cruce, filas));
  return partes.length
    ? 'Valores fuera del dominio declarado en ' + cruce.titulo + ': ' + partes.join('; ') + '.'
    : '';
}

// La misma comparacion que NUCLEO::MENOR-P: numeros por su valor, fechas y
// horas por su valor, textos por sus caracteres.
function compararSecciones(a, b){
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  if (typeof a === 'string' && typeof b === 'string') {
    const fa = FECHANUM(a), fb = FECHANUM(b);
    if (fa !== null && fb !== null) return fa - fb;
    const ha = HORANUM(a), hb = HORANUM(b);
    if (ha !== null && hb !== null) return ha - hb;
    return a < b ? -1 : (a > b ? 1 : 0);
  }
  return 0;
}

function ejesDe(cruce, filas){
  return {filas: conDominio(ejeSegunLosDatos(filas, cruce.ejeFilas, cruce), cruce.dominioFilas),
          columnas: conDominio(ejeSegunLosDatos(filas, cruce.ejeColumnas, cruce),
                               cruce.dominioColumnas)};
}

function ejeSegunLosDatos(filas, campo, cruce){
  return ordenarEje(distintosDe(filas, campo), campo, cruce);
}

// Si el eje es uno de los campos por los que la coleccion declara orden,
// sus valores van ordenados; si no, en el de primera aparicion.
function ordenarEje(valores, campo, cruce){
  if (!(cruce.orden || []).includes(campo)) return valores;
  return valores.slice().sort(compararSecciones);
}

function dibujarCruce(cruce, indiceCruce, app){
  const filas = filasDelCruce(cruce);
  const ejes = ejesDe(cruce, filas);
  for (const s of seccionesDe(cruce, filas)) {
    const suyas = s === null ? filas : filas.filter(f => IG(f[cruce.secciones], s));
    dibujarUnaRejilla(cruce, indiceCruce, suyas, ejes, s, app);
  }
  const aviso = avisoFueraDeDominio(cruce, filas);
  if (aviso) {
    const p = document.createElement('p');
    p.className = 'aviso-de-dominio';
    p.textContent = 'Aviso: ' + aviso;
    app.appendChild(p);
  }
}

function dibujarUnaRejilla(cruce, indiceCruce, filas, ejes, valorDeSeccion, contenedor){
  const seccion = document.createElement('section');
  const titulo = document.createElement('h3');
  titulo.textContent = valorDeSeccion === null
    ? cruce.titulo
    : cruce.titulo + ' - ' + T(valorDeSeccion);
  seccion.appendChild(titulo);

  const envoltura = document.createElement('div');
  envoltura.className = 'envoltura';
  const t = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  const esquina = document.createElement('th');
  esquina.textContent = cruce.etiquetaFilas;
  trh.appendChild(esquina);
  for (const c of ejes.columnas) {
    const th = document.createElement('th');
    th.textContent = T(c);
    trh.appendChild(th);
  }
  thead.appendChild(trh);
  t.appendChild(thead);

  const campoCelda = cruce.campoCelda;
  const tbody = document.createElement('tbody');
  for (const vf of ejes.filas) {
    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.textContent = T(vf);
    tr.appendChild(th);
    for (const vc of ejes.columnas) {
      // TODAS las que caen ahi, no la primera. Son varias cuando la vista
      // declaro unica-salvo: entonces el choque existe y hay que ensenarlo.
      const enLaCasilla = filas.filter(f => IG(f[cruce.ejeFilas], vf) &&
                                            IG(f[cruce.ejeColumnas], vc));
      let td;
      if (cruce.entrada && campoCelda && campoCelda.rol === 'entrada' &&
          enLaCasilla.length === 1) {
        // Una vista de entrada deja escribir en la casilla, si la casilla
        // es de una sola fila.
        td = controlDe(cruce.coleccion, campoCelda, enLaCasilla[0],
                       'c|' + indiceCruce + '|' + T(valorDeSeccion) + '|' + T(vf) + '|' + T(vc));
      } else {
        td = document.createElement('td');
        const celda = td;
        registrar(() => {
          celda.textContent = enLaCasilla.map(f => TC(f[cruce.celda], cruce.campoCelda)).join(' / ');
        });
      }
      const marcada = td;
      registrar(() => {
        // Las marcas de las filas que caen en la casilla la tinen.
        marcada.classList.remove('problema', 'advertencia', 'informativa');
        for (const fila of enLaCasilla) {
          const suyas = marcasDe(cruce.coleccion, fila);
          if (suyas.length) { marcada.classList.add(suyas[0].clase); break; }
        }
      });
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  t.appendChild(tbody);
  envoltura.appendChild(t);
  seccion.appendChild(envoltura);
  contenedor.appendChild(seccion);
}

// --- Tabla de una coleccion ---

// Las filas en el orden en que se van a MOSTRAR, cada una con el indice que
// ocupa en D y, si empieza un grupo, la cabecera que va encima. Agrupar es
// solo de presentacion: D no se toca, y la fila anterior sigue significando
// lo mismo. En una hoja de calculo no se puede separar las dos cosas.
function ordenarParaMostrar(filas, campo){
  const pares = filas.map((fila, indice) => ({fila, indice, cabecera: null}));
  if (!campo) return pares;
  const grupos = [];
  for (const par of pares) {
    let g = grupos.find(x => IG(x.valor, par.fila[campo]));
    if (!g) { g = {valor: par.fila[campo], pares: []}; grupos.push(g); }
    g.pares.push(par);
  }
  const salida = [];
  for (const g of grupos) {
    g.pares.forEach((par, i) => {
      salida.push({fila: par.fila, indice: par.indice,
                   cabecera: i === 0 ? g.valor : null});
    });
  }
  return salida;
}

function dibujarTabla(tabla, contenedor){
  const seccion = contenedor;

  const envoltura = document.createElement('div');
  envoltura.className = 'envoltura';
  const t = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  for (const c of tabla.campos) {
    const th = document.createElement('th');
    th.textContent = c.e;
    trh.appendChild(th);
  }
  const thEstado = document.createElement('th');
  thEstado.textContent = tabla.columnaEstado;
  trh.appendChild(thEstado);
  thead.appendChild(trh);
  t.appendChild(thead);

  const tbody = document.createElement('tbody');
  ordenarParaMostrar(D[tabla.coleccion], tabla.agrupa).forEach(par => {
    const fila = par.fila, indice = par.indice;
    if (par.cabecera !== null) {
      const trg = document.createElement('tr');
      const tdg = document.createElement('td');
      tdg.className = 'grupo';
      tdg.colSpan = tabla.campos.length + 1;
      tdg.textContent = T(par.cabecera);
      trg.appendChild(tdg);
      tbody.appendChild(trg);
    }
    const tr = document.createElement('tr');
    for (const c of tabla.campos) {
      // El rol decide que se dibuja: de entrada es un control; fijo, texto,
      // salvo en una fila que el usuario anadio, donde lo escribe el; y
      // derivado, texto que se pone al dia.
      const escribible = c.rol === 'entrada' || (c.rol === 'fijo' && fila.__nueva);
      let td;
      if (escribible) {
        td = controlDe(tabla.coleccion, c, fila,
                       't|' + tabla.vista + '|' + indice + '|' + c.n);
      } else {
        td = document.createElement('td');
        td.className = c.rol;
        const celda = td;
        registrar(() => {
          celda.textContent = c.clave
            // Relacion uno a muchos: cada fila relacionada por su clave.
            ? (fila[c.n] || []).map(r => c.clave.map(k => T(r[k])).join(' ')).join(', ')
            : TC(fila[c.n], c);
        });
      }
      const marcada = td;
      registrar(() => {
        // La marca senala los campos que declara su alcance.
        marcada.classList.remove('problema', 'advertencia', 'informativa');
        const suyas = marcasDe(tabla.coleccion, fila).filter(m => m.campos.includes(c.n));
        if (suyas.length) marcada.classList.add(suyas[0].clase);
      });
      tr.appendChild(td);
    }
    const tdEstado = document.createElement('td');
    tdEstado.className = 'estado';
    registrar(() => { tdEstado.textContent = estadoDe(tabla.coleccion, fila); });
    tr.appendChild(tdEstado);
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  envoltura.appendChild(t);
  seccion.appendChild(envoltura);

  // Crecer es nativo aqui: un boton. La fila nueva lleva controles para sus
  // campos fijos y de entrada: en una coleccion que crece, fijo quiere decir
  // que lo escribe quien crea la fila.
  if (tabla.crece) {
    const boton = document.createElement('button');
    boton.textContent = '+ Añadir fila';
    boton.addEventListener('click', () => {
      const nueva = {__nueva: true};
      for (const c of tabla.campos) if (c.rol !== 'derivado') nueva[c.n] = '';
      D[tabla.coleccion].push(nueva);
      reordenar(tabla.coleccion);
      const primero = tabla.campos.find(c => c.rol !== 'derivado');
      FOCO = primero ? 't|' + tabla.vista + '|' + (D[tabla.coleccion].length - 1) +
                       '|' + primero.n : null;
      construir();
    });
    seccion.appendChild(boton);
  }

  const leyenda = MARCAS.filter(m => m.coleccion === tabla.coleccion);
  if (leyenda.length) {
    const p = document.createElement('p');
    p.className = 'leyenda';
    for (const m of leyenda) {
      const s = document.createElement('span');
      s.className = m.clase;
      s.textContent = m.leyenda;
      p.appendChild(s);
    }
    seccion.appendChild(p);
  }
}

// --- El orden declarado de una coleccion ---
//
// El evaluador ve las filas en el orden que declara la coleccion, y VECINO
// toma la fila anterior del arreglo: si el usuario anade una fila o cambia
// un campo del orden, el arreglo se vuelve a ordenar con la misma
// comparacion que NUCLEO::ORDENAR-FILAS (por el primer campo y, a igualdad,
// por el siguiente; estable). Una fila con algun campo del orden vacio va al
// final: es una fila que se esta escribiendo. Devuelve si cambio el orden.
function reordenar(nombre){
  const campos = ORDENES[nombre];
  const filas = D[nombre];
  if (!campos || !filas) return false;
  const antes = filas.slice();
  const incompleta = f => campos.some(c => VACIO(f[c]));
  const ordenadas = filas.map((f, i) => ({f, i})).sort((a, b) => {
    const ia = incompleta(a.f), ib = incompleta(b.f);
    if (ia !== ib) return ia ? 1 : -1;
    if (!ia) {
      for (const c of campos) {
        const r = compararSecciones(a.f[c], b.f[c]);
        if (r !== 0) return r;
      }
    }
    return a.i - b.i;
  }).map(p => p.f);
  filas.splice(0, filas.length, ...ordenadas);
  return filas.some((f, i) => f !== antes[i]);
}

// --- La forma de la pagina ---
//
// Todo lo que, si cambia, obliga a construir de nuevo: las secciones y los
// ejes de cada rejilla, cuantas filas hay y en que orden se muestran.
function firma(){
  const partes = [];
  for (const c of CRUCES) {
    const filas = filasDelCruce(c);
    const ejes = ejesDe(c, filas);
    partes.push(JSON.stringify([seccionesDe(c, filas), ejes.filas, ejes.columnas,
                                filas.length]));
  }
  for (const t of TABLAS) {
    partes.push(JSON.stringify(ordenarParaMostrar(D[t.coleccion], t.agrupa)
                               .map(p => [p.indice, p.cabecera])));
  }
  return partes.join('|');
}

let FOCO = null;

function construir(){
  recalcularTodo();
  const activo = document.activeElement;
  const ref = FOCO || (activo && activo.dataset ? activo.dataset.ref : null);
  const seleccion = (activo && typeof activo.selectionStart === 'number')
    ? [activo.selectionStart, activo.selectionEnd] : null;
  FOCO = null;
  ACTUALIZADORES = [];
  const app = document.getElementById('app');
  app.textContent = '';
  dibujarVistas(app);
  if (RECALCULO_INCOMPLETO) avisarRecalculoIncompleto(app);
  FIRMA = firma();
  if (ref) {
    const vuelta = Array.from(app.querySelectorAll('[data-ref]'))
                        .find(x => x.dataset.ref === ref);
    if (vuelta) {
      vuelta.focus();
      if (seleccion && typeof vuelta.setSelectionRange === 'function') {
        try { vuelta.setSelectionRange(seleccion[0], seleccion[1]); } catch(e) {}
      }
    }
  }
}

function avisarRecalculoIncompleto(app){
  const aviso = document.createElement('p');
  aviso.className = 'aviso';
  aviso.textContent = 'Los valores calculados no acabaron de estabilizarse. ' +
    'Puede haber una dependencia circular entre filas.';
  app.insertBefore(aviso, app.firstChild);
}

function actualizar(){
  recalcularTodo();
  if (firma() !== FIRMA) { construir(); return; }
  for (const f of ACTUALIZADORES) f();
}

// Cada vista es una seccion con su titulo, un ancla para el indice y un
// enlace para volver arriba. El indice de la pagina es la navegacion: un
// enlace por vista, en el orden en que se declararon.
function dibujarVistas(app){
  const indice = document.getElementById('indice');
  if (indice) {
    indice.textContent = '';
    for (const o of ORDEN) {
      const v = o.tipo === 'cruce' ? CRUCES[o.indice] : TABLAS[o.indice];
      const a = document.createElement('a');
      a.href = '#' + v.id;
      a.textContent = v.titulo;
      indice.appendChild(a);
    }
  }
  for (const o of ORDEN) {
    const v = o.tipo === 'cruce' ? CRUCES[o.indice] : TABLAS[o.indice];
    const seccion = document.createElement('section');
    seccion.id = v.id;
    const titulo = document.createElement('h2');
    titulo.textContent = v.titulo;
    seccion.appendChild(titulo);
    if (o.tipo === 'cruce') dibujarCruce(v, o.indice, seccion);
    else dibujarTabla(v, seccion);
    const arriba = document.createElement('a');
    arriba.href = '#arriba';
    arriba.className = 'arriba';
    arriba.textContent = 'volver arriba';
    seccion.appendChild(arriba);
    app.appendChild(seccion);
  }
}

construir();
</script>
